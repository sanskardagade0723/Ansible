---
- name: Find and stop nginx
  hosts: rke2
  become: true # matab root user permission

  tasks:
    - name: Find process
      command: pgrep -a nginx
      register: nginx_process
      ignore_errors: true

    - name: Show process
      debug:
        var: nginx_process.stdout_lines

    - name: Kill process
      command: pkill nginx
      when: nginx_process.rc == 0